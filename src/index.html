<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="js/main.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="product-category">
        <ul class="category-grid">
          <li>
            <a href="product_listing/index.html?category=tents">
              <img
                src="https://byui-cse.github.io/wdd330-ww-course/images/category-tents.svg"
                alt="Image of tent"
                width="96"
                height="96"
              />
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=backpacks">
              <img
                src="https://byui-cse.github.io/wdd330-ww-course/images/category-backpacks.svg"
                alt="Image of backpack"
                width="96"
                height="96"
              />
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=sleeping-bags">
              <img
                src="https://byui-cse.github.io/wdd330-ww-course/images/category-sleepingbags.svg"
                alt="Image of sleeping bag"
                width="96"
                height="96"
              />
            </a>
          </li>
          <li>
            <a href="product_listing/index.html?category=hammocks">
              <img
                src="https://byui-cse.github.io/wdd330-ww-course/images/category-hammocks.svg"
                alt="Image of hammock"
                width="96"
                height="96"
              />
            </a>
          </li>
        </ul>
      </section>

      <!-- Newsletter Signup -->
      <section class="newsletter-section">
        <div class="newsletter-box">
          <h2>📬 Stay in the Loop</h2>
          <p>
            Subscribe to our newsletter for gear tips, trail stories, and
            exclusive deals.
          </p>
          <form id="newsletter-form" class="newsletter-form">
            <input
              type="email"
              id="newsletter-email"
              placeholder="Enter your email address"
              required
            />
            <button type="submit">Subscribe</button>
          </form>
          <p id="newsletter-msg" class="newsletter-msg"></p>
        </div>
      </section>
    </main>

    <footer id="main-footer">
      &copy;2025 ⛺ SleepOutside ⛺ WDD 330 ⛺ BYU-Idaho for BYU-Pathway
      Worldwide Online
    </footer>
  </body>
</html>
