<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Register</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/register.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider auth-main">
      <div class="auth-card">
        <h2>Create Account</h2>
        <p class="auth-subtitle">
          Join SleepOutside for a chance to win $500 in gear! 🎁
        </p>
        <div id="register-error" class="auth-error" style="display: none"></div>
        <div
          id="register-success"
          class="auth-success"
          style="display: none"
        ></div>
        <form id="register-form" class="auth-form">
          <label for="fname">First Name</label>
          <input
            type="text"
            id="fname"
            name="fname"
            required
            placeholder="First name"
          />
          <label for="lname">Last Name</label>
          <input
            type="text"
            id="lname"
            name="lname"
            required
            placeholder="Last name"
          />
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="your@email.com"
          />
          <label for="street">Street Address</label>
          <input
            type="text"
            id="street"
            name="street"
            required
            placeholder="123 Main St"
          />
          <label for="city">City</label>
          <input
            type="text"
            id="city"
            name="city"
            required
            placeholder="City"
          />
          <label for="state">State</label>
          <input
            type="text"
            id="state"
            name="state"
            required
            placeholder="State"
            maxlength="2"
          />
          <label for="zip">Zip Code</label>
          <input
            type="text"
            id="zip"
            name="zip"
            required
            placeholder="Zip"
            maxlength="10"
          />
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Choose a password"
            minlength="6"
          />
          <label for="avatar">Avatar URL (optional)</label>
          <input
            type="url"
            id="avatar"
            name="avatar"
            placeholder="https://..."
          />
          <button type="submit">Create Account</button>
        </form>
        <p class="auth-link">
          Already have an account? <a href="/login/index.html">Login here</a>
        </p>
      </div>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
